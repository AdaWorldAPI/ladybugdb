[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "ladybugdb"
version = "0.1.0"
description = "Unified cognitive substrate: SQL + Cypher + Vector + Hamming over LanceDB"
readme = "README.md"
license = "Apache-2.0"
requires-python = ">=3.9"
authors = [
    { name = "Jan Hübener", email = "jan@adaworld.dev" },
    { name = "AdaWorldAPI" },
]
keywords = [
    "database",
    "graph",
    "vector",
    "hamming",
    "similarity",
    "search",
    "cypher",
    "sql",
    "lancedb",
    "duckdb",
    "vsa",
    "cognitive",
    "ai",
]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "Intended Audience :: Science/Research",
    "License :: OSI Approved :: Apache Software License",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Database",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
    "Topic :: Software Development :: Libraries :: Python Modules",
    "Typing :: Typed",
]

dependencies = [
    "numpy>=1.20.0",
    "pyarrow>=10.0.0",
]

[project.optional-dependencies]
# Full installation
all = [
    "ladybugdb[numba,lance,duckdb,embeddings]",
]

# SIMD acceleration
numba = [
    "numba>=0.58.0",
]

# LanceDB storage backend
lance = [
    "lancedb>=0.3.0",
]

# DuckDB SQL engine
duckdb = [
    "duckdb>=0.9.0",
]

# Embedding generation
embeddings = [
    "sentence-transformers>=2.2.0",
]

# Development dependencies
dev = [
    "pytest>=7.0.0",
    "pytest-cov>=4.0.0",
    "pytest-benchmark>=4.0.0",
    "black>=23.0.0",
    "ruff>=0.1.0",
    "mypy>=1.0.0",
    "pre-commit>=3.0.0",
    "ipython>=8.0.0",
]

# Documentation
docs = [
    "mkdocs>=1.5.0",
    "mkdocs-material>=9.0.0",
    "mkdocstrings[python]>=0.24.0",
]

[project.urls]
Homepage = "https://github.com/AdaWorldAPI/ladybugdb"
Documentation = "https://github.com/AdaWorldAPI/ladybugdb/tree/main/docs"
Repository = "https://github.com/AdaWorldAPI/ladybugdb"
Issues = "https://github.com/AdaWorldAPI/ladybugdb/issues"
Changelog = "https://github.com/AdaWorldAPI/ladybugdb/blob/main/CHANGELOG.md"

[project.scripts]
ladybugdb = "ladybugdb.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["ladybugdb"]

[tool.hatch.build.targets.sdist]
include = [
    "/ladybugdb",
    "/tests",
    "/docs",
    "/README.md",
    "/CHANGELOG.md",
    "/CONTRIBUTING.md",
    "/LICENSE",
]

# Black configuration
[tool.black]
line-length = 100
target-version = ["py39", "py310", "py311", "py312"]
include = '\.pyi?$'
exclude = '''
/(
    \.git
    | \.hatch
    | \.mypy_cache
    | \.tox
    | \.venv
    | _build
    | buck-out
    | build
    | dist
)/
'''

# Ruff configuration
[tool.ruff]
line-length = 100
target-version = "py39"

[tool.ruff.lint]
select = [
    "E",   # pycodestyle errors
    "W",   # pycodestyle warnings
    "F",   # Pyflakes
    "I",   # isort
    "B",   # flake8-bugbear
    "C4",  # flake8-comprehensions
    "UP",  # pyupgrade
    "ARG", # flake8-unused-arguments
    "SIM", # flake8-simplify
]
ignore = [
    "E501",   # line too long (handled by black)
    "B008",   # do not perform function calls in argument defaults
    "C901",   # too complex
    "ARG001", # unused function argument
]

[tool.ruff.lint.per-file-ignores]
"__init__.py" = ["F401"]
"tests/*" = ["ARG001"]

[tool.ruff.lint.isort]
known-first-party = ["ladybugdb"]

# Mypy configuration
[tool.mypy]
python_version = "3.9"
warn_return_any = true
warn_unused_configs = true
disallow_untyped_defs = true
disallow_incomplete_defs = true
check_untyped_defs = true
no_implicit_optional = true
warn_redundant_casts = true
warn_unused_ignores = true
show_error_codes = true

[[tool.mypy.overrides]]
module = [
    "numba.*",
    "lancedb.*",
    "duckdb.*",
    "pyarrow.*",
]
ignore_missing_imports = true

# Pytest configuration
[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py", "*_test.py"]
python_functions = ["test_*"]
addopts = [
    "-v",
    "--tb=short",
    "--strict-markers",
]
markers = [
    "slow: marks tests as slow (deselect with '-m \"not slow\"')",
    "integration: marks tests as integration tests",
    "benchmark: marks tests as benchmarks",
]

# Coverage configuration
[tool.coverage.run]
source = ["ladybugdb"]
branch = true
omit = [
    "*/tests/*",
    "*/__init__.py",
]

[tool.coverage.report]
exclude_lines = [
    "pragma: no cover",
    "def __repr__",
    "if self.debug:",
    "if settings.DEBUG",
    "raise AssertionError",
    "raise NotImplementedError",
    "if __name__ == .__main__.:",
    "if TYPE_CHECKING:",
]
